services:
  eewrenderer:
    image: ghcr.io/eewbot/eew-renderer:v0.6.0
    hostname: eewrenderer
    container_name: eewrenderer${VARIANT:-}__eewrenderer
    restart: unless-stopped

    environment:
      LISTEN: 0.0.0.0:3000
      HMAC_KEY: ${HMAC_KEY}
      INSTANCE_NAME: ${INSTANCE_NAME}
      MINIMUM_RESPONSE_INTERVAL: ${MINIMUM_RESPONSE_INTERVAL:-200ms}
      IMAGE_CACHE_CAPACITY: ${IMAGE_CACHE_CAPACITY:-512}

    command: /usr/bin/eew-renderer

    deploy:
      resources:
        limits:
          memory: 2g

    networks:
      - default

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    hostname: cloudflared
    container_name: eewrenderer${VARIANT:-}__cloudflared

    restart: unless-stopped

    environment:
      TUNNEL_LOGFILE: /dev/stdout

    command: tunnel run --token ${TUNNEL_TOKEN}
    user: root

    deploy:
      resources:
        limits:
          memory: 128m

    networks:
      - default

networks:
  default:
    name: eewrenderer${VARIANT:-}__default
